# Deploys the Flutter web app to the Firebase Hosting staging site.
# Uses the same backend as production; only the Firebase Hosting target differs.

name: Deploy to Firebase Hosting Staging
on:
  push:
    branches:
      - staging
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build web --release
      # Inject Google Maps API key from repo secret (key never committed)
      - name: Inject Google Maps API key
        run: |
          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            sed -i 's|__GOOGLE_MAPS_API_KEY__|${{ secrets.GOOGLE_MAPS_API_KEY }}|g' build/web/index.html
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLLECTIVE_ACTION_FD893 }}
          channelId: live
          projectId: collective-action-fd893
          target: staging
