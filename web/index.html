<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Collective Action" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Collective Action</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0175C2" />

  <!-- Tab icon (favicon): SVG for modern browsers, PNG fallback when generated -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <!-- PWA / Add to home screen -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <script>
    window.__onGoogleMapsReady = function () { };
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&loading=async&callback=__onGoogleMapsReady"
    async defer></script>
  <!-- deck.gl replaces the removed google.maps.visualization.HeatmapLayer on web. -->
  <script src="https://unpkg.com/deck.gl@8.9.22/dist.min.js"></script>
  <script src="https://unpkg.com/@deck.gl/google-maps@8.9.22/dist.min.js"></script>
  <script src="dashboard_map.js"></script>
</head>

<body>
  <!-- Unlock audio on first user gesture (required for mobile Chrome/Firefox). Must run before Flutter. -->
  <script>
    (function () {
      var unlocked = false;
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        try {
          var C = window.AudioContext || window.webkitAudioContext;
          if (C) {
            var ctx = new C();
            if (ctx.resume) ctx.resume();
          }
        } catch (e) { }
        document.removeEventListener('touchstart', unlock, true);
        document.removeEventListener('touchend', unlock, true);
        document.removeEventListener('click', unlock, true);
        document.removeEventListener('keydown', unlock, true);
      }
      document.addEventListener('touchstart', unlock, true);
      document.addEventListener('touchend', unlock, true);
      document.addEventListener('click', unlock, true);
      document.addEventListener('keydown', unlock, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
