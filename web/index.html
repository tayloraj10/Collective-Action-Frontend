<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Collective Action" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Collective Action</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0175C2" />

  <!-- Tab icon (favicon): SVG for modern browsers, PNG fallback when generated -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <!-- PWA / Add to home screen -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Google Maps: sync load in head (like TrashMap). Must finish before body. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=visualization"></script>
</head>

<body>
  <!-- Start Flutter only after window load so Maps script has definitely run (matches TrashMap). -->
  <script>
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.type = 'application/javascript';
      s.async = true;
      document.body.appendChild(s);
    });
  </script>
</body>

</html>
