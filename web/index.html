<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Collective Action" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Collective Action</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0175C2" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Google Maps: async loading + callback so API is ready before Flutter uses it (fixes full maps page not loading). -->
  <script>
    window.__googleMapsReady = false;
    window.__onGoogleMapsReady = function () { window.__googleMapsReady = true; };
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=visualization&loading=async&callback=__onGoogleMapsReady"
    async
    defer></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
