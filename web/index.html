<!DOCTYPE html>
<!--
  Deployment: Before deploying to production, replace __GOOGLE_MAPS_API_KEY__ with your real key
  (e.g. run scripts/inject_maps_key.ps1 before build, or replace in CI).
  After 'flutter build web', verify build/web/index.html contains the Maps script and your key.
-->
<html>

<head>
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Collective Action" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Collective Action</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0175C2" />

  <!-- Tab icon (favicon): SVG for modern browsers, PNG fallback when generated -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <!-- PWA / Add to home screen -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Google Maps: sync load in head (like TrashMap). Must finish before body. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&libraries=visualization"></script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
